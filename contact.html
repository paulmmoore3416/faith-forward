<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Faith Forward</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo-link"><img src="faithforwardlogo.png" alt="Faith Forward Logo" class="logo"></a>
            <div class="nav-links">
                <a href="about.html">About Us</a>
                <a href="resources.html">Resources</a>
                <a href="events.html">Events</a>
                <a href="contact.html">Contact</a>
                <a href="#" class="give-button">Give</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="info-section">
            <h2>Contact Us</h2>
            <p>For inquiries, please fill out the form below. We will get back to you as soon as possible.</p>
            <form action="https://formspree.io/f/{your_form_id}" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit" class="learn-more-button">Send</button>
            </form>
            <p><strong>Faith Forward Headquarters</strong></p>
            <p>123 Main Street</p>
            <p>St. Louis, MO 63139</p>
            <p><strong>Phone:</strong> (314) 555-1212</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Faith Forward. All Rights Reserved.</p>
    </footer>
</body>
</html>
