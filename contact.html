<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Faith Forward</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/input.css">
</head>
<body class="bg-gray-50 text-faith-slate">
    <header class="fixed top-0 w-full z-50 bg-white/95 backdrop-blur shadow-sm border-b border-gray-100">
        <nav class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3 group">
                <img src="/faithforwardlogo.png" alt="Faith Forward Logo" class="h-12 w-auto group-hover:scale-105 transition-transform">
                <span class="text-2xl font-serif font-bold text-faith-navy tracking-tight hidden sm:inline">Faith Forward</span>
            </a>
            <div class="hidden md:flex items-center space-x-8 text-sm font-bold uppercase tracking-widest text-faith-navy">
                <a href="about.html" class="hover:text-faith-gold transition-colors">Our Story</a>
                <a href="resources.html" class="hover:text-faith-gold transition-colors">Resources</a>
                <a href="events.html" class="hover:text-faith-gold transition-colors">Events</a>
                <a href="contact.html" class="text-faith-gold border-b-2 border-faith-gold">Contact</a>
                <a href="#" class="bg-faith-gold text-white px-6 py-2 rounded-full hover:bg-faith-gold-dark transition-all shadow-md">Give Back</a>
            </div>
            <button id="mobile-menu-btn" class="md:hidden text-3xl">☰</button>
        </nav>
    </header>

    <main class="pt-32 pb-20">
        <div class="container mx-auto px-4 max-w-4xl">
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col md:flex-row">
                <div class="md:w-1/3 bg-faith-navy p-12 text-white">
                    <h2 class="text-3xl font-serif font-bold mb-6">Get In Touch</h2>
                    <p class="text-gray-400 mb-8">Whether you're a veteran in need or someone looking to help, we're here to talk.</p>
                    <div class="space-y-6">
                        <p class="flex items-center"><span class="mr-4">📍</span> St. Louis, MO</p>
                        <p class="flex items-center"><span class="mr-4">✉️</span> help@faithforward.org</p>
                    </div>
                </div>
                <div class="md:w-2/3 p-12">
                    <form class="space-y-6">
                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-bold mb-2 uppercase tracking-wide">Name</label>
                                <input type="text" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-lg focus:outline-none focus:border-faith-gold">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2 uppercase tracking-wide">Email</label>
                                <input type="email" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-lg focus:outline-none focus:border-faith-gold">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-2 uppercase tracking-wide">Message</label>
                            <textarea rows="5" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-lg focus:outline-none focus:border-faith-gold"></textarea>
                        </div>
                        <button type="submit" class="bg-faith-gold text-white px-8 py-3 rounded-lg font-bold shadow-lg hover:bg-faith-gold-dark transition-all">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white py-12 border-t border-gray-100">
        <div class="container mx-auto px-4 text-center">
            <p class="text-gray-500 font-bold tracking-widest text-xs uppercase">&copy; 2025 Faith Forward</p>
        </div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
