<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost? Let's Get Back on Track | Faith Forward</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/input.css">
</head>
<body class="bg-gray-50 text-faith-slate h-screen flex flex-col">
    <header class="fixed top-0 w-full z-50 bg-white/95 backdrop-blur shadow-sm border-b border-gray-100">
        <nav class="container mx-auto px-4 py-3 flex justify-center">
            <a href="index.html" class="flex items-center space-x-3 group">
                <img src="/faithforwardlogo.png" alt="Faith Forward Logo" class="h-12 w-auto">
                <span class="text-2xl font-serif font-bold text-faith-navy tracking-tight">Faith Forward</span>
            </a>
        </nav>
    </header>

    <main class="flex-grow flex items-center justify-center pt-20">
        <div class="text-center px-4">
            <h1 class="text-9xl font-serif font-bold text-faith-gold/20 mb-[-2rem]">404</h1>
            <h2 class="text-4xl md:text-5xl font-serif font-bold text-faith-navy mb-6">Even the best of us lose our way sometimes.</h2>
            <p class="text-xl text-gray-600 mb-10 max-w-lg mx-auto leading-relaxed">The mission you're looking for isn't here, but we can help you get back to the home base.</p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="index.html" class="bg-faith-navy text-white px-10 py-4 rounded-lg text-lg font-bold shadow-xl hover:bg-faith-gold transition-all">Return Home</a>
                <a href="resources.html" class="bg-white border-2 border-faith-navy text-faith-navy px-10 py-4 rounded-lg text-lg font-bold transition-all">Get Resources</a>
            </div>
        </div>
    </main>

    <footer class="bg-white py-12 border-t border-gray-100">
        <div class="container mx-auto px-4 text-center">
            <p class="text-gray-500 font-bold tracking-widest text-xs uppercase italic">"No one is more professional than I."</p>
        </div>
    </footer>
</body>
</html>
